<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1780" role="img" aria-labelledby="title desc">
  <title id="title">Planta simplificada do primeiro andar</title>
  <desc id="desc">Planta vertical baseada na referência arquitetônica e na organização espacial atual. A entrada fica no topo. A área superior tem rampa central, som e DJ junto à parede transversal, e mezanino nas paredes esquerda, direita e transversal. A circulação segue pelo lado direito até a parte inferior, com bar e escada à esquerda e banheiros à direita.</desc>
  <defs>
    <pattern id="mezzanine-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V10" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
  </defs>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="miter">
    <!-- Contorno e entrada superior, proporcionados a partir da planta arquitetônica. -->
    <path id="outline" d="M40 50H142 M218 50H310V1375H280V1715H165 M115 1715H40V50"/>
    <!-- Área superior: Área 3 à esquerda, Área 1 à direita e Área 2 transversal. -->
    <g id="upper-main-walls" data-level="main">
      <path id="area-3-main" data-area="area-3" d="M40 115V605"/>
      <path id="area-1-main" data-area="area-1" d="M310 115V605"/>
      <path id="area-2-main" data-area="area-2" d="M40 605H238"/>
    </g>
    <!-- Mezanino: segunda parede paralela e faixa hachurada nas Áreas 1, 2 e 3. -->
    <g id="mezzanine" data-level="mezzanine">
      <path id="area-3-mezzanine" data-area="area-3" d="M72 207V573"/>
      <path id="area-1-mezzanine" data-area="area-1" d="M278 207V573"/>
      <path id="area-2-mezzanine" data-area="area-2" d="M72 573H238"/>
      <path d="M40 207H72V573H40Z" fill="url(#mezzanine-hatch)" stroke-width="1.5"/>
      <path d="M278 207H310V573H278Z" fill="url(#mezzanine-hatch)" stroke-width="1.5"/>
      <path d="M72 573H238V605H72Z" fill="url(#mezzanine-hatch)" stroke-width="1.5"/>
    </g>    <!-- Rampa central da área superior. -->
    <g id="skate-ramp">
      <path d="M40 207V225C40 263 78 287 120 287H230C272 287 310 263 310 225V207"/>
    </g>
    <!-- Som/DJ junto à Área 2, preservando a circulação lateral direita. -->
    <path id="sound-dj" d="M100 486H218V552H100Z"/>
    <!-- Circulação: sai pela abertura direita da Área 2 sem espelhar o percurso. -->
    <path id="circulation" d="M238 605V688H115"/>
    <!-- Obstáculo estrutural entre a área superior e a inferior. -->
    <path id="upper-lower-obstacle" d="M40 688H115V790H40Z"/>
    <!-- Parte inferior: Área 5 à esquerda e Área 4 à direita. -->
    <path id="area-5-main" data-area="area-5" data-level="main" d="M40 790V1086.87"/>
    <path id="area-4-main" data-area="area-4" data-level="main" d="M310 745V1375"/>
    <!-- Mezanino da Sala 2: laterais e parede inferior, mantendo livre a passagem superior direita. -->
    <g id="mezzanine-sala-2" data-level="mezzanine">
      <path data-area="area-5" d="M72 790V1343"/>
      <path data-area="area-4" d="M278 745V1343"/>
      <path d="M72 1343H278"/>
      <path d="M40 790H72V1343H40Z" fill="url(#mezzanine-hatch)" stroke-width="1.5"/>
      <path d="M278 745H310V1343H278Z" fill="url(#mezzanine-hatch)" stroke-width="1.5"/>
      <path d="M72 1343H278V1375H72Z" fill="url(#mezzanine-hatch)" stroke-width="1.5"/>
    </g>
    <!-- Bar abaixo da Área 5. -->
    <path id="bar" d="M40 1086.87H126V1510H40 M68 1119.87H110V1478H68Z"/>
    <!-- Escada para o segundo andar no extremo inferior esquerdo. -->
    <g id="stairs-floor-2" stroke-width="1.5">
      <path d="M40 1510H126V1715H40Z"/>
      <path d="M40 1528H126 M40 1546H126 M40 1564H126 M40 1582H126 M40 1600H126 M40 1618H126 M40 1636H126 M40 1654H126 M40 1672H126 M40 1690H126"/>
    </g>
    <!-- Banheiros no bloco inferior direito. -->
    <g id="bathrooms">
      <path d="M165 1375H280V1715H165Z"/>
      <path d="M165 1518H280 M223 1375V1715"/>
      <path d="M165 1440H187 M165 1590H187"/>
    </g>
    <!-- Direção de entrada pelo topo. -->
    <path id="entrance-direction" d="M180 10V42 M172 33L180 42L188 33" stroke-width="1.5"/>
  </g>
</svg>
