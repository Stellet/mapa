<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 992" role="img" aria-labelledby="title desc">
  <title id="title">Planta do segundo andar</title>
  <desc id="desc">Base visual do segundo andar conforme o mapa v9. Entrada e escada no canto inferior direito. Primeira sala na metade inferior, com posições futuras das obras 01 a 06. Segunda sala na metade superior, com posições futuras das obras 07 a 14. Sala de vidro no canto superior direito, com posição futura da obra 15. Blocos estruturais e passagens permanecem livres.</desc>
  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="miter">
    <!-- Contorno geral proporcional ao desenho do PDF v9. -->
    <path id="perimeter" d="M0 0H360V992H0Z"/>

    <!-- Compartimento estrutural superior esquerdo; função não identificada no PDF. -->
    <path id="upper-left-room" d="M79 0V94H0"/>

    <!-- Sala de vidro: frente e lateral internas distinguem-se das paredes opacas. -->
    <g id="glass-room" data-work-range="15" stroke-width="1.3">
      <path d="M179 0V168H360" stroke-dasharray="6 4"/>
    </g>

    <!-- Segunda sala: obras 07 a 14 ficam em seu perímetro e área livre. -->
    <g id="second-room" data-work-range="07-14">
      <path d="M0 448H38V616H0"/>
      <path d="M95 448H264V616H95Z"/>
    </g>

    <!-- Vãos livres entre os blocos mantêm a passagem para a primeira sala. -->
    <g id="circulation" stroke-width="1">
      <path d="M38 448H95 M264 448H360" stroke-dasharray="3 7" stroke-opacity=".45"/>
    </g>

    <!-- Sequência de compartimentos estreitos no lado esquerdo da primeira sala. -->
    <g id="left-service-bays" stroke-width="1.2">
      <path d="M0 648H47V836H0"/>
      <path d="M0 680H47 M0 711H47 M0 742H47 M0 773H47 M0 804H47"/>
    </g>

    <!-- Primeira sala: obras 01 a 06; volume estrutural inferior esquerdo preservado. -->
    <g id="first-room" data-work-range="01-06">
      <path d="M0 877H211V992"/>
    </g>

    <!-- A entrada ocorre pela escada do canto inferior direito. -->
    <g id="entrance-stairs" stroke-width="1.2">
      <path d="M275 900H337V968H275Z"/>
      <path d="M275 914H337 M275 928H337 M275 942H337 M275 956H337"/>
      <path d="M306 896V866 M300 872L306 866L312 872"/>
    </g>
  </g>
</svg>