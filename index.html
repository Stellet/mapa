<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2ª RIOS—REAIS — CC-LADO B</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="data/local-data.generated.js"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/positions.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/works.js"></script>
    <script defer src="js/sheet.js"></script>
    <script defer src="js/map.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/explore.js"></script>
    <script defer src="js/editor.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#exploration">PULAR PARA AS OBRAS</a>
    <div id="navigation-shell" class="navigation-shell">
    <header class="site-header">
      <h1 class="site-brand"><img src="assets/logo-riosreais.svg" width="4603" height="1801" alt="Rios Reais 2026"></h1>
    </header>
    <nav id="sub-nav" class="sub-nav" aria-label="Explorar exposição">
      <div class="mode-selector" role="group" aria-label="Modo de exploração">
        <button type="button" data-mode="map" aria-pressed="true" aria-controls="map-view">MAPA</button>
        <button type="button" data-mode="list" aria-pressed="false" aria-controls="list-view">LISTA</button>
      </div>
      <span class="nav-separator" aria-hidden="true">|</span>
      <div class="floor-control">
        <span id="floor-label">ANDAR</span>
        <div id="floor-selector" class="floor-selector" role="group" aria-labelledby="floor-label"></div>
      </div>
      <span class="nav-separator" aria-hidden="true">|</span>
      <div class="speech-control">
        <button id="speak-screen" type="button" aria-pressed="false" aria-describedby="speech-status">OUVIR TELA</button>
      </div>
    </nav>
    </div>
    <main id="exploration" tabindex="-1">

      <p id="speech-status" class="note" role="status"></p>
      <p id="results-status" role="status" aria-live="polite"></p>
      <section id="map-view" aria-labelledby="map-heading">
        <span id="map-top-sentinel" aria-hidden="true"></span>
        <div class="map-heading">
          <h2 id="map-heading">Andar 1</h2>
          <span id="map-caption">Planta simplificada</span>
        </div>
        <p id="map-instructions">Toque em um número para selecionar uma obra.</p>
        <div id="map-controls" class="map-controls" role="group" aria-label="Zoom do mapa">
          <button id="zoom-out" type="button" aria-label="Diminuir zoom">−</button>
          <button id="zoom-reset" type="button" aria-label="Restaurar 100%: ajustar à largura">100%</button>
          <button id="zoom-in" type="button" aria-label="Aumentar zoom">+</button>
          <span id="zoom-status" class="sr-only" role="status"></span>
        </div>
        <div id="map-viewport" class="map-viewport" tabindex="0" role="region" aria-label="Mapa do andar; use as setas para deslocar o mapa">
        <svg id="map-svg" class="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" preserveAspectRatio="xMinYMin meet" role="group" aria-labelledby="map-heading" aria-describedby="map-instructions">
          <defs>
            <pattern id="map-grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-width="0.35" stroke-opacity="0.16" vector-effect="non-scaling-stroke" />
            </pattern>
            <pattern id="map-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#map-grid-fine)" />
              <path d="M100 0H0V100" fill="none" stroke="#fff" stroke-width="0.5" stroke-opacity="0.24" vector-effect="non-scaling-stroke" />
            </pattern>
          </defs>
          <g id="map-content">
            <rect id="map-grid" x="0" y="0" width="360" height="1780" fill="url(#map-grid-major)" pointer-events="none" aria-hidden="true" />
            <image id="floor-map" href="maps/andar-1.svg" width="360" height="1780" aria-label="Planta do andar" />
            <g id="map-location-labels" aria-hidden="true" pointer-events="none" fill="#fff" font-family="Courier, monospace" font-size="12" text-anchor="middle">
              <text x="102" y="108">BAR</text>
              <text x="174" y="250">PISTA DE SKATE</text>
              <text x="170" y="512">SOM / DJ</text>
              <text x="90" y="1200">BAR</text>
              <text x="267" y="1455">BANHEIROS</text>
            </g>
            <foreignObject x="0" y="0" width="360" height="1780" class="map-overlay">
              <div xmlns="http://www.w3.org/1999/xhtml" class="map-markers">
                <div id="slots" role="group" aria-label="Slots de obras"></div>
                <div id="map-clusters" class="map-clusters"></div>
              </div>
            </foreignObject>
          </g>
        </svg>
        <div id="cluster-fan" class="cluster-fan" role="group" aria-label="Obras do grupo" hidden></div>
        </div>

        <p id="floor-status" role="status"></p>
      </section>
      <section id="list-view" aria-labelledby="list-heading" hidden>
        <h2 id="list-heading">Obras — Andar 1</h2>
        <label class="group-control"><input id="group-by-area" type="checkbox" checked> Agrupar por área</label>
        <div id="work-list"></div>
      </section>
      <noscript><p>Ative o JavaScript para selecionar andares e obras.</p></noscript>
    </main>
    <section id="work-sheet" class="work-sheet" role="dialog" aria-modal="false" aria-labelledby="work-heading" hidden>
      <header class="sheet-header" id="sheet-header">
        <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Expandir painel" aria-expanded="false" aria-controls="sheet-content"><span aria-hidden="true"></span></button>
        <div class="sheet-preview">
          <img id="work-thumbnail" class="work-thumbnail" alt="" width="72" height="80" draggable="false">
          <div class="sheet-preview-info">
            <div class="sheet-heading-row">
              <p id="work-number" class="work-number" aria-live="polite" aria-atomic="true"></p>
              <button id="close-sheet" type="button" aria-label="Fechar painel"><span class="close-icon" aria-hidden="true">×</span><span class="close-label" aria-hidden="true">FECHAR</span></button>
            </div>
            <h2 id="work-heading"></h2>
            <p id="work-artist"></p>
          </div>
        </div>
        <div id="sheet-partial-actions" class="sheet-partial-actions">
          <button id="sheet-more" type="button" aria-controls="sheet-content">VER MAIS</button>
          <button class="partial-interest" type="button">TENHO INTERESSE</button>
        </div>
      </header>
      <div id="sheet-content" class="sheet-content" tabindex="0" role="region" aria-label="Informações da obra">
        <img id="work-image" class="work-image" alt="" width="480" height="240">
        <p id="work-description"></p>
        <dl class="work-sale">
          <div id="work-sale-status-row"><dt>VENDA</dt><dd id="work-sale-status"></dd></div>
          <div id="work-price-row"><dt>PREÇO</dt><dd id="work-price"></dd></div>
        </dl>
        <section id="work-audio-section" class="sheet-section" aria-labelledby="audio-heading" hidden>
          <h3 id="audio-heading">AUDIODESCRIÇÃO</h3>
          <audio id="work-audio" controls preload="none" aria-labelledby="audio-heading"></audio>
        </section>
        <section id="work-reading-section" class="sheet-section" aria-labelledby="reading-heading" hidden>
          <h3 id="reading-heading">LEITURA</h3>
          <p id="work-reading"></p>
        </section>
      </div>
      <footer class="sheet-footer">
        <button class="interest-button" type="button">TENHO INTERESSE</button></footer>
    </section>
        <section class="sponsors-strip" aria-label="Patrocinadores e apoiadores">
          <img src="assets/regua-patrocinadores-riosreais.svg" alt="Patrocinadores e apoiadores da exposição" width="4500" height="585" loading="lazy">
        </section>
    <footer id="site-footer" class="site-footer" aria-label="Créditos do site">
      <p class="footer-credits">Realização <a id="venue-instagram" href="https://www.instagram.com/___ladob/" target="_blank" rel="noopener noreferrer">Lado B</a>. Desenvolvido por <a href="https://instagram.com/NebulaDevs" target="_blank" rel="noopener noreferrer">NebulaDevs</a></p>
    </footer>
  </body>
</html>
